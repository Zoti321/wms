name: wms-api UAT gate

# 发版/上线门禁：跑 tests/uat。日常 PR 仍走 wms-api-test.yml（不含 UAT）。
on:
  workflow_dispatch:
    inputs:
      uat_base_url:
        description: "可选 staging API 源站（如 https://staging.example.com）；留空则 MySQL + TestClient"
        required: false
        type: string
        default: ""

defaults:
  run:
    working-directory: services/wms-api

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wms
          MYSQL_USER: wms
          MYSQL_PASSWORD: wms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: mysql+pymysql://wms:wms@127.0.0.1:3306/wms?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://wms:wms@127.0.0.1:3306/wms?charset=utf8mb4
      JWT_SECRET: test-jwt-secret-not-for-prod
      APP_ENV: test
      UAT_BASE_URL: ${{ inputs.uat_base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/wms-api/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run UAT suite
        run: uv run pytest tests/uat -v --tb=short --fail-on-skipped -m uat

      - name: Summarize gate
        if: success()
        run: |
          echo "## UAT gate passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${UAT_BASE_URL}" ]; then
            echo "- Target: \`${UAT_BASE_URL}\` (staging HTTP)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Target: local ASGI TestClient + MySQL 8 service" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Next: complete manual role sign-off in \`docs/uat/backend-signoff.md\`" >> "$GITHUB_STEP_SUMMARY"
