name: web-admin tests

on:
  pull_request:
    paths:
      - "apps/web-admin/**"
      - "apps/pnpm-lock.yaml"
      - "apps/package.json"
      - "apps/pnpm-workspace.yaml"
      - ".github/workflows/web-admin-test.yml"
  push:
    branches: [main]
    paths:
      - "apps/web-admin/**"
      - "apps/pnpm-lock.yaml"
      - "apps/package.json"
      - "apps/pnpm-workspace.yaml"
      - ".github/workflows/web-admin-test.yml"

defaults:
  run:
    working-directory: apps

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web-admin typecheck

      - name: Unit tests
        run: pnpm --filter web-admin test

      - name: Production build
        run: pnpm --filter web-admin build

      - name: Install Playwright browsers
        run: pnpm --filter web-admin exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm --filter web-admin test:e2e
